<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            min-width: 150px;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(-1px);
        }
        
        .info-panel {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            text-align: left;
        }
        
        .info-item {
            margin: 10px 0;
            font-size: 14px;
            color: #666;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #e8f4ff;
            color: #0066cc;
            font-size: 14px;
            min-height: 50px;
        }
        
        .debug-info {
            margin-top: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            font-family: monospace;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 Hello Game</h1>
        <p style="color: #666; margin-bottom: 20px;">一个简单的 Telegram 游戏示例</p>
        
        <div class="score-display" id="scoreDisplay">100</div>
        
        <div class="controls">
            <button onclick="changeScore(-10)">-10 分</button>
            <button onclick="changeScore(10)">+10 分</button>
            <button onclick="submitCurrentScore()" style="background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);">
                📤 提交分数
            </button>
        </div>
        
        <div class="info-panel">
            <div class="info-item">👤 玩家: <span id="playerName">加载中...</span></div>
            <div class="info-item">🆔 ID: <span id="playerId">加载中...</span></div>
            <div class="info-item">🌐 环境: <span id="environment">检测中...</span></div>
        </div>
        
        <div class="status" id="statusMessage">
            等待操作...
        </div>
        
        <div class="debug-info" id="debugInfo">
            <!-- 调试信息会显示在这里 -->
        </div>
        
        <div style="margin-top: 30px; font-size: 12px; color: #999;">
            注意：请在 Telegram 客户端中打开以获得完整功能
        </div>
    </div>

    <script>
        // 全局变量
        let currentScore = 100;
        let isInTelegram = false;
        
        // 初始化函数
        function init() {
            logDebug('页面初始化开始...');
            
            // 获取URL参数
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('user_id');
            const userName = urlParams.get('username');
            
            // 显示用户信息
            document.getElementById('playerName').textContent = 
                userName ? decodeURIComponent(userName) : '未知';
            document.getElementById('playerId').textContent = userId || '未知';
            
            // 检测是否在Telegram环境中
            detectTelegramEnvironment();
            
            // 更新环境显示
            document.getElementById('environment').textContent = 
                isInTelegram ? 'Telegram 客户端' : '网页浏览器';
            
            logDebug('页面初始化完成');
            updateStatus('准备就绪，可以提交分数');
        }
        
        // 检测Telegram环境
        function detectTelegramEnvironment() {
            logDebug('检测Telegram环境...');
            
            // 方法1：检查TelegramGameProxy（旧版游戏API）
            if (typeof TelegramGameProxy !== 'undefined') {
                logDebug('检测到 TelegramGameProxy');
                isInTelegram = true;
                return;
            }
            
            // 方法2：检查Telegram.WebApp（新版WebApp API）
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                logDebug('检测到 Telegram.WebApp');
                isInTelegram = true;
                // 初始化WebApp
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                return;
            }
            
            // 方法3：检查iframe父窗口（Telegram内嵌游戏）
            try {
                if (window.parent && window.parent !== window) {
                    logDebug('检测到可能是iframe环境');
                    // 尝试与父窗口通信
                    window.parent.postMessage({ type: 'ping' }, '*');
                }
            } catch (e) {
                logDebug('iframe检测失败: ' + e.message);
            }
            
            logDebug('未在Telegram环境中');
            isInTelegram = false;
        }
        
        // 修改分数
        function changeScore(amount) {
            currentScore = Math.max(0, currentScore + amount);
            document.getElementById('scoreDisplay').textContent = currentScore;
            updateStatus(`当前分数: ${currentScore}`);
        }
        
        // 提交分数
        function submitCurrentScore() {
            logDebug(`尝试提交分数: ${currentScore}`);
            updateStatus('正在提交分数...');
            
            if (!isInTelegram) {
                updateStatus('错误：请在 Telegram 客户端中打开此页面');
                alert('请在 Telegram 中打开此游戏以提交分数到排行榜');
                return;
            }
            
            try {
                // 方法1：使用TelegramGameProxy（推荐用于游戏）
                if (typeof TelegramGameProxy !== 'undefined') {
                    logDebug('使用 TelegramGameProxy.sendScore()');
                    TelegramGameProxy.sendScore(currentScore);
                    updateStatus('✅ 分数已提交成功！');
                    logDebug('分数提交成功');
                    return;
                }
                
                // 方法2：使用Telegram.WebApp（新版API）
                if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                    logDebug('使用 Telegram.WebApp.sendData()');
                    Telegram.WebApp.sendData(JSON.stringify({
                        action: 'submit_score',
                        score: currentScore,
                        game: 'hello'
                    }));
                    updateStatus('✅ 分数已提交成功！');
                    logDebug('分数提交成功');
                    return;
                }
                
                // 方法3：备用方法 - 直接调用Bot API（需要后端支持）
                submitScoreViaAPI();
                
            } catch (error) {
                logDebug('提交分数时出错: ' + error.message);
                updateStatus('❌ 提交失败: ' + error.message);
            }
        }
        
        // 备用方法：通过API提交分数
        async function submitScoreViaAPI() {
            try {
                logDebug('尝试通过API提交分数...');
                
                // 这里需要你的后端API端点
                // 示例：向你的Cloudflare Worker发送分数
                const response = await fetch('https://your-bot-endpoint.com/submit-score', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: document.getElementById('playerId').textContent,
                        score: currentScore,
                        game: 'hello'
                    })
                });
                
                if (response.ok) {
                    updateStatus('✅ 分数已通过API提交！');
                    logDebug('API提交成功');
                } else {
                    updateStatus('❌ API提交失败');
                }
            } catch (error) {
                logDebug('API提交失败: ' + error.message);
            }
        }
        
        // 更新状态信息
        function updateStatus(message) {
            document.getElementById('statusMessage').textContent = message;
            logDebug('状态更新: ' + message);
        }
        
        // 记录调试信息
        function logDebug(message) {
            const debugDiv = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            debugDiv.innerHTML = `[${timestamp}] ${message}<br>` + debugDiv.innerHTML;
            
            // 同时输出到控制台
            console.log(`[Debug] ${message}`);
        }
        
        // 监听来自父窗口的消息（Telegram可能会发送）
        window.addEventListener('message', function(event) {
            logDebug('收到消息: ' + JSON.stringify(event.data));
            
            // 如果是Telegram的分数提交确认
            if (event.data && event.data.type === 'share_score') {
                updateStatus('✅ 分数分享成功！');
            }
        });
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
        
        // 额外检查：3秒后再次检查Telegram环境
        setTimeout(() => {
            detectTelegramEnvironment();
            if (isInTelegram) {
                updateStatus('✅ 检测到 Telegram 环境，可以正常提交分数');
            } else {
                updateStatus('⚠️ 未检测到 Telegram 环境，某些功能可能受限');
            }
        }, 3000);
    </script>
</body>
</html>
