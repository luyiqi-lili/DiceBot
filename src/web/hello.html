<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hello Telegram Game</title>
  
  <!-- 添加 Telegram 游戏 SDK -->
  <script src="https://telegram.org/js/games.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      padding: 16px;
      line-height: 1.4;
    }
    h1 {
      margin-top: 0;
    }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
    }
    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .ok {
      color: green;
      font-weight: 600;
    }
    .bad {
      color: red;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <h1>Hello Telegram Game 👋</h1>
  <p>Telegram Game 环境测试</p>

  <!-- Telegram Game 状态 -->
  <div class="card">
    <h3>Telegram Game 状态</h3>
    <div id="tg-status">检测中...</div>
  </div>

  <!-- 游戏得分提交测试 -->
  <div class="card">
    <h3>游戏得分提交测试</h3>
    <button id="submit-score">提交得分 (100分)</button>
    <button id="submit-higher-score">提交更高分 (500分)</button>
    <div id="score-result"></div>
  </div>

  <!-- URL 参数 -->
  <div class="card">
    <h3>URL 参数</h3>
    <pre id="url-params"></pre>
  </div>

  <!-- 获取用户信息 -->
  <div class="card">
    <h3>用户信息</h3>
    <pre id="user-info"></pre>
    <button id="share-game">分享游戏</button>
  </div>

  <!-- 调试信息 -->
  <div class="card">
    <h3>调试信息</h3>
    <button id="check-sdk">检查 SDK</button>
    <pre id="debug-info"></pre>
  </div>

  <script>
    const statusEl = document.getElementById('tg-status');
    const urlParamsEl = document.getElementById('url-params');
    const submitScoreBtn = document.getElementById('submit-score');
    const submitHigherScoreBtn = document.getElementById('submit-higher-score');
    const scoreResultEl = document.getElementById('score-result');
    const userInfoEl = document.getElementById('user-info');
    const shareGameBtn = document.getElementById('share-game');
    const checkSdkBtn = document.getElementById('check-sdk');
    const debugInfoEl = document.getElementById('debug-info');

    // 立即检查 TelegramGame
    console.log('window.TelegramGame:', window.TelegramGame);
    console.log('window.Telegram:', window.Telegram);
    console.log('window.location.search:', window.location.search);

    // 检查环境
    function checkEnvironment() {
      let envInfo = '';
      
      // 检查 TelegramGame
      if (window.TelegramGame) {
        statusEl.innerHTML = '<span class="ok">✅ 已在 Telegram Game 环境中</span>';
        envInfo += '✅ TelegramGame: 存在\n';
        
        // 显示可用的方法
        envInfo += '可用的方法: ' + Object.keys(window.TelegramGame).join(', ') + '\n';
      } else {
        statusEl.innerHTML = '<span class="bad">❌ 不在 Telegram Game 环境</span>';
        envInfo += '❌ TelegramGame: 不存在\n';
      }
      
      // 检查 Telegram.WebApp (不同系统的 API)
      if (window.Telegram && window.Telegram.WebApp) {
        envInfo += '✅ Telegram.WebApp: 存在\n';
      } else {
        envInfo += '❌ Telegram.WebApp: 不存在\n';
      }
      
      // 检查 URL 参数
      const urlParams = new URLSearchParams(window.location.search);
      const paramsObj = {};
      urlParams.forEach((value, key) => {
        paramsObj[key] = value;
      });
      urlParamsEl.textContent = JSON.stringify(paramsObj, null, 2);
      
      // 显示用户信息（从 URL 参数获取）
      const userId = urlParams.get('user_id');
      const userName = urlParams.get('username');
      if (userId) {
        userInfoEl.textContent = JSON.stringify({
          id: userId,
          name: userName || '未知',
          platform: 'Telegram Game'
        }, null, 2);
      }
      
      debugInfoEl.textContent = envInfo;
    }

    // 页面加载后检查
    setTimeout(checkEnvironment, 100);

    // 提交得分测试
    submitScoreBtn.onclick = () => {
      if (window.TelegramGame) {
        scoreResultEl.innerHTML = '提交中...';
        try {
          // 提交得分到 Telegram
          TelegramGame.setScore(100, (success) => {
            if (success) {
              scoreResultEl.innerHTML = '<span class="ok">✅ 得分提交成功！</span>';
              scoreResultEl.innerHTML += '<p>用户现在可以在 @gamebot 中看到他们的最高分</p>';
            } else {
              scoreResultEl.innerHTML = '<span class="bad">❌ 得分提交失败</span>';
            }
          });
        } catch (e) {
          scoreResultEl.innerHTML = '<span class="bad">❌ 提交出错: ' + e.toString() + '</span>';
        }
      } else {
        scoreResultEl.innerHTML = '<span class="bad">❌ 不在 Telegram Game 环境中</span>';
      }
    };

    // 提交更高分
    submitHigherScoreBtn.onclick = () => {
      if (window.TelegramGame) {
        scoreResultEl.innerHTML = '提交中...';
        try {
          TelegramGame.setScore(500, true, (success) => {
            if (success) {
              scoreResultEl.innerHTML = '<span class="ok">✅ 更高分提交成功！</span>';
              scoreResultEl.innerHTML += '<p>已更新最高分到 500</p>';
            } else {
              scoreResultEl.innerHTML = '<span class="bad">❌ 更高分提交失败</span>';
            }
          });
        } catch (e) {
          scoreResultEl.innerHTML = '<span class="bad">❌ 提交出错: ' + e.toString() + '</span>';
        }
      } else {
        scoreResultEl.innerHTML = '<span class="bad">❌ 不在 Telegram Game 环境中</span>';
      }
    };

    // 分享游戏
    shareGameBtn.onclick = () => {
      if (window.TelegramGame) {
        try {
          TelegramGame.shareScore();
        } catch (e) {
          alert('分享失败: ' + e.toString());
        }
      } else {
        alert('不在 Telegram Game 环境中');
      }
    };

    // 检查 SDK
    checkSdkBtn.onclick = () => {
      checkEnvironment();
    };
  </script>
</body>
</html>
