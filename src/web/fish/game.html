<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎣 钓鱼游戏 - Telegram</title>
    <script src="https://telegram.org/js/games.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Segoe UI Emoji', sans-serif;
            background: linear-gradient(135deg, #1a2980 0%, #26d0ce 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }
        
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #1a2980;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats-panel {
            background: #f0f8ff;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 2px solid #26d0ce;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #1a2980;
        }
        
        .coin {
            color: #FFD700;
        }
        
        .game-controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .bait-control {
            background: #fff3cd;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #ffc107;
        }
        
        .bait-slider {
            width: 100%;
            margin: 15px 0;
        }
        
        .bait-display {
            text-align: center;
            font-size: 1.2em;
            margin-top: 10px;
        }
        
        .cast-btn, .pull-btn {
            width: 100%;
            padding: 20px;
            font-size: 1.3em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .cast-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }
        
        .cast-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
        }
        
        .pull-btn {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
        }
        
        .pull-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(33, 150, 243, 0.3);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .timer {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #2196F3;
            margin: 10px 0;
            min-height: 36px;
        }
        
        .result-panel {
            background: #e8f5e9;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid #4CAF50;
            display: none;
        }
        
        .result-panel.show {
            display: block;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-success {
            background: #e8f5e9;
            border-color: #4CAF50;
        }
        
        .result-fail {
            background: #ffebee;
            border-color: #f44336;
        }
        
        .records-panel {
            background: #f5f5f5;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .record-item {
            padding: 10px 15px;
            margin-bottom: 8px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        
        .record-item.fail {
            border-left-color: #f44336;
        }
        
        .record-time {
            font-size: 0.9em;
            color: #666;
        }
        
        .record-desc {
            margin-top: 5px;
            font-weight: 500;
        }
        
        .status-message {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
            background: #e3f2fd;
            color: #1976D2;
            font-weight: 500;
        }
        
        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 0.9em;
            color: #666;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            body { padding: 10px; }
            .game-container { padding: 15px; }
            h1 { font-size: 1.6em; margin-bottom: 5px; }
            .subtitle { font-size: 0.9em; }
            .stats-panel { padding: 12px; }
            .stat-item { padding: 10px; }
            .stat-value { font-size: 1.3em; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .bait-control { padding: 12px; }
            .cast-btn, .pull-btn { padding: 14px; font-size: 1.1em; }
            .records-panel { max-height: 200px; padding: 12px; }
            .result-panel { padding: 12px; }
            .header { margin-bottom: 15px; }
            .game-controls { gap: 12px; margin-bottom: 15px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎣 钓鱼游戏</h1>
            <p class="subtitle">在 Telegram 中享受钓鱼的乐趣！</p>
        </div>
        
        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">💰 当前余额</div>
                    <div class="stat-value coin" id="balance">--</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">🎣 今日次数</div>
                    <div class="stat-value" id="todayCount">--/<span id="maxAttempts">20</span></div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">⏰ 剩余次数</div>
                    <div class="stat-value" id="remainingAttempts">--</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">🏆 最佳渔获</div>
                    <div class="stat-value" id="bestCatch">--</div>
                </div>
            </div>
            
            <div class="status-message" id="statusMessage">
                正在加载游戏数据...
            </div>
        </div>
        
        <div class="game-controls">
            <div class="bait-control">
                <h3>🎣 选择鱼饵</h3>
                <input type="range" id="baitSlider" class="bait-slider" min="1" max="10" value="1">
                <div class="bait-display">
                    鱼饵花费: <span id="baitCost">1</span> 💰
                </div>
            </div>
            
            <button id="castBtn" class="cast-btn">
                🎣 抛竿
            </button>
            
            <div class="timer" id="timer" style="display: none;">
                时间: <span id="elapsedTime">0</span> 秒
            </div>
            
            <button id="pullBtn" class="pull-btn" disabled>
                🎣 拉杆
            </button>
        </div>
        
        <div id="resultPanel" class="result-panel">
            <h3>🎯 钓鱼结果</h3>
            <div id="resultContent"></div>
        </div>
        
        <div class="records-panel">
            <h3>📝 今日渔获记录</h3>
            <div id="recordsList">
                <p style="text-align: center; color: #666; padding: 20px;">
                    今天还没有钓鱼记录...
                </p>
            </div>
        </div>
        
        <!-- 已移除可钓鱼类显示部分 -->
        
        <div class="debug-info" id="debugInfo" style="display: none;">
            <h4>调试信息</h4>
            <pre id="debugContent"></pre>
        </div>
    </div>

    <script>
        // 全局变量
        let gameData = {
            userId: null,
            balance: 0,
            todayCount: 0,
            remainingAttempts: 0,
            maxAttempts: 20,
            castData: null,
            startTime: null,
            timerInterval: null
        };
        
        // DOM 元素
        const elements = {
            balance: document.getElementById('balance'),
            todayCount: document.getElementById('todayCount'),
            maxAttempts: document.getElementById('maxAttempts'),
            remainingAttempts: document.getElementById('remainingAttempts'),
            bestCatch: document.getElementById('bestCatch'),
            baitSlider: document.getElementById('baitSlider'),
            baitCost: document.getElementById('baitCost'),
            castBtn: document.getElementById('castBtn'),
            pullBtn: document.getElementById('pullBtn'),
            timer: document.getElementById('timer'),
            elapsedTime: document.getElementById('elapsedTime'),
            resultPanel: document.getElementById('resultPanel'),
            resultContent: document.getElementById('resultContent'),
            recordsList: document.getElementById('recordsList'),
            statusMessage: document.getElementById('statusMessage'),
            debugInfo: document.getElementById('debugInfo'),
            debugContent: document.getElementById('debugContent')
        };
        
        // 初始化游戏
        async function initGame() {
            // 从URL获取用户信息
            const urlParams = new URLSearchParams(window.location.search);
            gameData.userId = urlParams.get('user_id') || 'unknown';
            gameData.auth = urlParams.get('auth') || '';
            gameData.authTs = urlParams.get('auth_ts') || '';
            
            // 更新状态
            updateStatus('正在加载游戏数据...');
            
            // 加载用户数据
            await loadUserData();
            
            // 设置鱼饵滑块事件
            elements.baitSlider.addEventListener('input', updateBaitCost);
            
            // 设置按钮事件
            elements.castBtn.addEventListener('click', handleCast);
            elements.pullBtn.addEventListener('click', handlePull);
            
            // 初始更新UI
            updateUI();
            
            updateStatus('游戏已就绪！');
            
            // 检查是否在Telegram环境中
            checkTelegramEnvironment();
        }
        
        // 加载用户数据
        async function loadUserData() {
            try {
                updateStatus('加载用户数据...');
                
                const params = new URLSearchParams({
                    user_id: gameData.userId,
                    auth: gameData.auth,
                    auth_ts: gameData.authTs
                });
                const response = await fetch(`/web/fish/data?${params.toString()}`);
                const result = await response.json();
                
                if (result.ok) {
                    const data = result.data;
                    gameData.balance = data.balance || 0;
                    gameData.todayCount = data.todayCount || 0;
                    gameData.remainingAttempts = data.remainingAttempts || 0;
                    gameData.maxAttempts = data.maxAttempts || 20;
                    
                    // 计算最佳渔获
                    if (data.records && data.records.length > 0) {
                        const successfulCatches = data.records.filter(r => r.hooked && r.fishValue);
                        if (successfulCatches.length > 0) {
                            const best = successfulCatches.reduce((max, curr) => 
                                curr.fishValue > max.fishValue ? curr : max
                            );
                            elements.bestCatch.textContent = `${best.fishValue}💰`;
                        }
                    }
                    
                    // 更新记录列表
                    updateRecordsList(data.records || []);
                    
                    updateStatus('数据加载完成');
                } else {
                    throw new Error(result.error || '加载失败');
                }
            } catch (error) {
                console.error('加载用户数据失败:', error);
                updateStatus(`加载失败: ${error.message}`, 'error');
            }
        }
        
        // 更新鱼饵花费显示
        function updateBaitCost() {
            const cost = parseInt(elements.baitSlider.value);
            elements.baitCost.textContent = cost;
            
            // 检查余额是否足够
            elements.castBtn.disabled = cost > gameData.balance;
        }
        
        // 处理抛竿
        async function handleCast() {
            if (gameData.remainingAttempts <= 0) {
                updateStatus('今日钓鱼次数已达上限！', 'error');
                return;
            }
            
            const baitCost = parseInt(elements.baitSlider.value);
            
            if (baitCost > gameData.balance) {
                updateStatus('余额不足！', 'error');
                return;
            }
            
            try {
                updateStatus('抛竿中...');
                elements.castBtn.disabled = true;
                
                const response = await fetch('/web/fish/cast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: gameData.userId,
                        auth: gameData.auth,
                        auth_ts: gameData.authTs,
                        baitCost: baitCost
                    })
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    gameData.castData = result.data;
                    gameData.startTime = Date.now();
                    
                    // 更新余额
                    gameData.balance = result.data.remainingBalance;
                    
                    // 开始计时器
                    startTimer();
                    
                    // 启用拉杆按钮
                    elements.pullBtn.disabled = false;
                    elements.castBtn.disabled = true;
                    elements.timer.style.display = 'block';
                    
                    updateStatus(result.data.message || '抛竿成功！');
                } else {
                    throw new Error(result.error || '抛竿失败');
                }
            } catch (error) {
                console.error('抛竿失败:', error);
                updateStatus(`抛竿失败: ${error.message}`, 'error');
                elements.castBtn.disabled = false;
            }
        }
        
        // 处理拉杆
        async function handlePull() {
            if (!gameData.castData) {
                updateStatus('请先抛竿！', 'error');
                return;
            }
            
            try {
                updateStatus('拉杆中...');
                elements.pullBtn.disabled = true;
                
                // 停止计时器
                stopTimer();
                
                const response = await fetch('/web/fish/pull', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: gameData.userId,
                        auth: gameData.auth,
                        auth_ts: gameData.authTs,
                        castId: gameData.castData.castId
                    })
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    // 显示结果
                    showResult(result.data);
                    
                    // 更新游戏数据
                    gameData.balance = result.data.newBalance;
                    gameData.todayCount = result.data.todayCount;
                    gameData.remainingAttempts = result.data.remainingAttempts;
                    
                    // 重置抛竿状态
                    gameData.castData = null;
                    gameData.startTime = null;
                    
                    // 重置UI
                    elements.pullBtn.disabled = true;
                    elements.castBtn.disabled = false;
                    elements.timer.style.display = 'none';
                    elements.elapsedTime.textContent = '0';
                    
                    // 重新加载数据以更新记录
                    await loadUserData();
                    
                    // 更新UI
                    updateUI();
                    
                    updateStatus(result.data.message || '拉杆完成！');
                } else {
                    throw new Error(result.error || '拉杆失败');
                }
            } catch (error) {
                console.error('拉杆失败:', error);
                updateStatus(`拉杆失败: ${error.message}`, 'error');
                elements.pullBtn.disabled = false;
                
                // 如果错误是因为抛竿记录过期，重置状态
                if (error.message.includes('过期') || error.message.includes('不存在')) {
                    gameData.castData = null;
                    elements.pullBtn.disabled = true;
                    elements.castBtn.disabled = false;
                    elements.timer.style.display = 'none';
                    stopTimer();
                }
            }
        }
        
        // 开始计时器
        function startTimer() {
            stopTimer(); // 先停止之前的计时器
            
            gameData.timerInterval = setInterval(() => {
                if (gameData.startTime) {
                    const elapsed = Math.floor((Date.now() - gameData.startTime) / 1000);
                    elements.elapsedTime.textContent = elapsed;
                }
            }, 1000);
        }
        
        // 停止计时器
        function stopTimer() {
            if (gameData.timerInterval) {
                clearInterval(gameData.timerInterval);
                gameData.timerInterval = null;
            }
        }
        
        // 显示结果
        function showResult(data) {
            const result = data.result;
            
            // 设置结果面板样式
            elements.resultPanel.className = 'result-panel';
            if (result.hooked) {
                elements.resultPanel.classList.add('result-success', 'show');
            } else {
                elements.resultPanel.classList.add('result-fail', 'show');
            }
            
            // 更新结果内容
            let resultHTML = `
                <p><strong>分数:</strong> ${result.score || 0}</p>
                <p><strong>花费:</strong> ${result.baitCost} 💰</p>
            `;
            
            if (result.hooked && result.fishName) {
                resultHTML += `
                    <p><strong>渔获:</strong> ${escapeHtml(result.fishName)}</p>
                    <p><strong>价值:</strong> ${result.fishValue} 💰</p>
                    <p><strong>恭喜！</strong> 🎉</p>
                `;
            } else if (result.score < 100) {
                resultHTML += '<p><strong>结果:</strong> 没有鱼咬钩... 😕</p>';
            } else {
                resultHTML += '<p><strong>结果:</strong> 鱼跑了！ 💥</p>';
            }
            
            resultHTML += `<p><strong>新余额:</strong> ${data.newBalance} 💰</p>`;
            resultHTML += `<p><strong>剩余次数:</strong> ${data.remainingAttempts} 次</p>`;
            
            elements.resultContent.innerHTML = resultHTML;
            
            // 5秒后自动隐藏结果
            setTimeout(() => {
                elements.resultPanel.classList.remove('show');
            }, 5000);
        }
        
        // 更新记录列表
        function updateRecordsList(records) {
            if (!records || records.length === 0) {
                elements.recordsList.innerHTML = `
                    <p style="text-align: center; color: #666; padding: 20px;">
                        今天还没有钓鱼记录...
                    </p>
                `;
                return;
            }
            
            let recordsHTML = '';
            
            // 按时间倒序显示
            records.forEach(record => {
                const time = new Date(record.timestamp).toLocaleTimeString('zh-CN', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                let desc = '';
                if (record.hooked && record.fishName) {
                    desc = `🎣 钓到 ${escapeHtml(record.fishName)} (${record.fishValue}💰)`;
                } else if (record.score < 100) {
                    desc = '🎣 没有鱼咬钩';
                } else {
                    desc = '🎣 鱼跑了';
                }
                
                recordsHTML += `
                    <div class="record-item ${record.hooked ? '' : 'fail'}">
                        <div class="record-time">${time}</div>
                        <div class="record-desc">${desc}</div>
                    </div>
                `;
            });
            
            elements.recordsList.innerHTML = recordsHTML;
        }
        
        // 更新UI
        function updateUI() {
            elements.balance.textContent = `${gameData.balance} 💰`;
            elements.todayCount.textContent = `${gameData.todayCount}/${gameData.maxAttempts}`;
            elements.remainingAttempts.textContent = gameData.remainingAttempts;
            
            // 更新鱼饵滑块最大值（不超过余额）
            const maxBait = Math.min(10, gameData.balance);
            elements.baitSlider.max = maxBait || 1;
            
            // 更新按钮状态
            updateBaitCost();
        }
        
        // 更新状态消息
        function updateStatus(message, type = 'info') {
            elements.statusMessage.textContent = message;
            elements.statusMessage.style.background = type === 'error' ? '#ffebee' : '#e3f2fd';
            elements.statusMessage.style.color = type === 'error' ? '#c62828' : '#1976D2';
        }
        
        // 检查Telegram环境
        function checkTelegramEnvironment() {
            if (typeof TelegramGameProxy !== 'undefined') {
                console.log('检测到 Telegram 游戏环境');
                // 可以添加Telegram特定功能
            }
        }
        
        // HTML转义辅助函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
