<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Game</title>
    <!-- 注意：根据官方规则，不得在此页面设置Cookie或添加外部广告链接 -->
    <style>
        /* [您的CSS样式保持不变，此处已省略以保持简洁] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .game-container { background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 40px; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        h1 { color: #333; margin-bottom: 20px; font-size: 32px; }
        .score-display { font-size: 48px; font-weight: bold; color: #667eea; margin: 20px 0; }
        .controls { display: flex; gap: 15px; justify-content: center; margin: 30px 0; flex-wrap: wrap; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 50px; cursor: pointer; font-weight: 600; transition: transform 0.3s, box-shadow 0.3s; min-width: 150px; }
        button:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4); }
        button:active { transform: translateY(-1px); }
        .info-panel { background: #f8f9fa; border-radius: 15px; padding: 20px; margin-top: 30px; text-align: left; }
        .info-item { margin: 10px 0; font-size: 14px; color: #666; }
        .status { margin-top: 20px; padding: 15px; border-radius: 10px; background: #e8f4ff; color: #0066cc; font-size: 14px; min-height: 50px; }
        .debug-info { margin-top: 15px; padding: 10px; background: #f5f5f5; border-radius: 8px; font-size: 12px; color: #666; font-family: monospace; text-align: left; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 Hello Game</h1>
        <p style="color: #666; margin-bottom: 20px;">一个简单的 Telegram 游戏示例</p>
        
        <div class="score-display" id="scoreDisplay">100</div>
        
        <div class="controls">
            <button onclick="changeScore(-10)">-10 分</button>
            <button onclick="changeScore(10)">+10 分</button>
            <button onclick="submitCurrentScore()" style="background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);">
                📤 提交分数
            </button>
        </div>
        
        <div class="info-panel">
            <div class="info-item">👤 玩家: <span id="playerName">加载中...</span></div>
            <div class="info-item">🆔 ID: <span id="playerId">加载中...</span></div>
            <div class="info-item">📝 消息ID: <span id="messageInfo">加载中...</span></div> <!-- 新增：用于显示消息标识 -->
            <div class="info-item">🌐 提交端点: <span id="endpointInfo">加载中...</span></div> <!-- 新增 -->
        </div>
        
        <div class="status" id="statusMessage">
            等待操作...
        </div>
        
        <div class="debug-info" id="debugInfo">
            <!-- 调试信息会显示在这里 -->
        </div>
        
        <div style="margin-top: 30px; font-size: 12px; color: #999;">
            本页面遵循 Telegram Bot API 规则。
        </div>
    </div>

    <script>
        // 全局变量
        let currentScore = 100;
        // 从URL获取游戏标识信息（这些参数需要你的Bot在启动游戏时通过gameUrl传递过来）
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        const userName = urlParams.get('username');
        // 以下参数对于在正确的聊天和消息上设置分数至关重要，必须传递
        const chatId = urlParams.get('chat_id'); // 如果是普通/群组游戏
        const messageId = urlParams.get('message_id'); // 如果是普通/群组游戏
        const inlineMessageId = urlParams.get('inline_message_id'); // 如果是inline游戏
        // 你的中间服务器端点（可以写死，也可以由Bot动态传入）
        const scoreSubmitEndpoint = urlParams.get('submit_endpoint') || '/web/hello/submit-score';

        // 初始化函数
        function init() {
            logDebug('页面初始化开始...');
            logDebug('URL参数:', Object.fromEntries(urlParams.entries()));
            
            // 显示用户信息
            document.getElementById('playerName').textContent = userName ? decodeURIComponent(userName) : '未知';
            document.getElementById('playerId').textContent = userId || '未知';
            
            // 显示消息标识信息（用于调试）
            const messageIdent = inlineMessageId ? `Inline ID: ${inlineMessageId}` : `Chat: ${chatId}, Msg: ${messageId}`;
            document.getElementById('messageInfo').textContent = messageIdent || '未提供';
            document.getElementById('endpointInfo').textContent = scoreSubmitEndpoint;
            
            logDebug('页面初始化完成');
            updateStatus('准备就绪。点击"提交分数"将分数发送到您的服务器。');
        }
        
        // 修改分数
        function changeScore(amount) {
            currentScore = Math.max(0, currentScore + amount);
            document.getElementById('scoreDisplay').textContent = currentScore;
            updateStatus(`当前分数: ${currentScore}`);
        }
        
        // 提交分数：遵循官方流程，发送到您的中间服务器
        async function submitCurrentScore() {
            logDebug(`尝试提交分数: ${currentScore}`);
            updateStatus('正在向中间服务器提交分数...');
            
            // 构建提交数据，包含分数和所有必要的标识符
            const submitData = {
                score: currentScore,
                user_id: userId,
                // 将消息标识传递给中间服务器，它需要这些来调用Telegram API
                chat_id: chatId,
                message_id: messageId,
                inline_message_id: inlineMessageId,
                // 可以添加游戏名称或其他元数据
                game: 'hello'
            };
            
            logDebug('提交数据:', submitData);
            
            try {
                const response = await fetch(scoreSubmitEndpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(submitData)
                });
                
                const result = await response.json();
                logDebug('服务器响应:', result);
                
                if (result.ok) {
                    updateStatus('✅ 分数已成功提交至服务器！');
                } else {
                    updateStatus(`❌ 提交失败: ${result.description || '服务器返回错误'}`);
                }
            } catch (error) {
                logDebug('网络请求失败: ', error.message);
                updateStatus('❌ 无法连接到提交服务器，请检查网络。');
            }
        }
        
        // 更新状态信息
        function updateStatus(message) {
            document.getElementById('statusMessage').textContent = message;
            logDebug('状态: ' + message);
        }
        
        // 记录调试信息
        function logDebug(message, data) {
            const debugDiv = document.getElementById('debugInfo');
            const timestamp = new Date().toLocaleTimeString();
            let logMessage = `[${timestamp}] ${message}`;
            if (data !== undefined) {
                logMessage += `: ${JSON.stringify(data)}`;
            }
            debugDiv.innerHTML = logMessage + '<br>' + debugDiv.innerHTML;
            console.log(logMessage);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
