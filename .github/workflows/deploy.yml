name: 🚀 Deploy Workers

on:
  push:
    branches:
      - '**'       # 监听所有分支
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: 部署到 Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          package-manager-cache: false

      - name: 安装项目依赖
        run: npm ci
          
      - name: 安装 Wrangler CLI
        run: npm install -g wrangler

      - name: Wrangler 登录（可选，以验证环境变量）
        run: wrangler whoami
  
      - name: 部署到 Workers
        env:
          DEV_BOT_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            wrangler deploy -e prod
            echo "ENV=prod" >> $GITHUB_ENV
            echo "WORKER_NAME=telegram-bot" >> $GITHUB_ENV
          else
            BRANCH_SLUG="$(printf '%s' "${GITHUB_REF_NAME}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' \
              | cut -c1-40)"
            if [ -z "$BRANCH_SLUG" ]; then
              BRANCH_SLUG="branch-${GITHUB_SHA::7}"
            fi
            WORKER_NAME="telegram-bot-dev-${BRANCH_SLUG}"
            wrangler deploy -e dev --name "$WORKER_NAME"
            if [ -z "${DEV_BOT_TOKEN:-}" ]; then
              echo "::error::DEV_BOT_TOKEN secret 未配置，dev Worker 无法写入独立 bot token。"
              exit 1
            fi
            printf '%s' "$DEV_BOT_TOKEN" | wrangler secret put TOKEN --name "$WORKER_NAME"
            WORKER_URL="https://${WORKER_NAME}.luyiqi-lili.workers.dev"
            curl -fsS -X POST "https://api.telegram.org/bot${DEV_BOT_TOKEN}/setWebhook" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg url "$WORKER_URL" '{url: $url, drop_pending_updates: false}')" \
              > /dev/null
            echo "ENV=dev" >> $GITHUB_ENV
            echo "WORKER_NAME=$WORKER_NAME" >> $GITHUB_ENV
          fi

      - name: 发送部署通知到 Telegram
        if: success()
        env:
          DEV_BOT_TOKEN: ${{ secrets.DEV_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          if [ "${ENV:-}" = "dev" ]; then
            BOT_TOKEN="${DEV_BOT_TOKEN:-}"
            CHAT_ID="-1002661676227"
            TOPIC_ID="2"
            export BOT_TOKEN CHAT_ID TOPIC_ID
          else
            BOT_TOKEN="${BOT_TOKEN:-${TOKEN:-}}"
            CHAT_ID="8080375150"
            TOPIC_ID=""
            unset DEV_BOT_TOKEN
            export BOT_TOKEN CHAT_ID TOPIC_ID
          fi
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "跳过 Telegram 部署通知：BOT_TOKEN/TOKEN secret 未配置。"
            exit 0
          fi
          bash scripts/notify-deploy.sh \
            "${ENV:-unknown}" \
            "${{ github.sha }}" \
            "${{ github.event.head_commit.message }}"
