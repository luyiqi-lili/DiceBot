<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hello Telegram Game</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      padding: 16px;
      line-height: 1.4;
    }
    h1 {
      margin-top: 0;
    }
    button {
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 12px;
    }
    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .ok {
      color: green;
      font-weight: 600;
    }
    .bad {
      color: red;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <h1>Hello Telegram Game 👋</h1>
  <p>Telegram Game 环境测试</p>

  <!-- Telegram Game 状态 -->
  <div class="card">
    <h3>Telegram Game 状态</h3>
    <div id="tg-status">检测中...</div>
  </div>

  <!-- 游戏得分提交测试 -->
  <div class="card">
    <h3>游戏得分提交测试</h3>
    <button id="submit-score">提交得分 (100分)</button>
    <div id="score-result"></div>
  </div>

  <!-- URL 参数 -->
  <div class="card">
    <h3>URL 参数</h3>
    <pre id="url-params"></pre>
  </div>

  <!-- 获取用户信息 -->
  <div class="card">
    <h3>用户信息（通过 Bot API 获取）</h3>
    <button id="get-user-info">获取用户信息</button>
    <pre id="user-info"></pre>
  </div>

  <script>
    const statusEl = document.getElementById('tg-status');
    const urlParamsEl = document.getElementById('url-params');
    const submitScoreBtn = document.getElementById('submit-score');
    const scoreResultEl = document.getElementById('score-result');
    const getUserInfoBtn = document.getElementById('get-user-info');
    const userInfoEl = document.getElementById('user-info');

    // 检查 TelegramGame 环境
    if (!window.TelegramGame) {
      statusEl.innerHTML = '<span class="bad">❌ 不在 Telegram Game 环境</span>';
      statusEl.innerHTML += '<p>可能的原因：</p><ul>';
      statusEl.innerHTML += '<li>没有通过 game 链接打开</li>';
      statusEl.innerHTML += '<li>Telegram 游戏 SDK 加载失败</li>';
      statusEl.innerHTML += '</ul>';
    } else {
      statusEl.innerHTML = '<span class="ok">✅ 已在 Telegram Game 中打开</span>';
      
      // 显示 URL 参数
      const urlParams = new URLSearchParams(window.location.search);
      const paramsObj = {};
      urlParams.forEach((value, key) => {
        paramsObj[key] = value;
      });
      urlParamsEl.textContent = JSON.stringify(paramsObj, null, 2);
      
      // 检查是否有必要的参数
      if (!urlParams.has('user_id') && !urlParams.has('start_param')) {
        statusEl.innerHTML += '<p class="bad">⚠️ 缺少 user_id 或 start_param，无法直接获取用户信息</p>';
      }
    }

    // 提交得分测试
    submitScoreBtn.onclick = () => {
      if (window.TelegramGame) {
        // 提交得分到 Telegram
        TelegramGame.setScore(100, (success) => {
          if (success) {
            scoreResultEl.innerHTML = '<span class="ok">✅ 得分提交成功！</span>';
            scoreResultEl.innerHTML += '<p>用户现在可以在 @gamebot 中看到他们的最高分</p>';
          } else {
            scoreResultEl.innerHTML = '<span class="bad">❌ 得分提交失败</span>';
          }
        });
      } else {
        scoreResultEl.innerHTML = '<span class="bad">❌ 不在 Telegram Game 环境中</span>';
      }
    };

    // 获取用户信息
    getUserInfoBtn.onclick = async () => {
      userInfoEl.textContent = '正在获取用户信息...';
      
      try {
        // 方法1: 通过 start_param 获取用户信息
        // 在 index.ts 中，当处理 callback_query 时，可以通过 callbackQuery.from 获取用户信息
        // 并传递给游戏页面
        
        const urlParams = new URLSearchParams(window.location.search);
        const startParam = urlParams.get('start_param') || urlParams.get('startparam');
        
        if (startParam) {
          // 假设 start_param 是经过编码的用户信息或用户ID
          userInfoEl.textContent = `start_param: ${startParam}\n\n`;
          userInfoEl.textContent += '注意: 在游戏中，您需要将用户信息通过 start_param 传递。\n';
          userInfoEl.textContent += '在 index.ts 中，处理 callback_query 时，可以这样设置：\n';
          userInfoEl.textContent += `\`url: 'https://your-domain.com/web/hello?user_id=' + callbackQuery.from.id\``;
        } else {
          // 尝试从 URL 中提取用户 ID
          const userId = urlParams.get('user_id');
          if (userId) {
            userInfoEl.textContent = `用户 ID: ${userId}\n\n`;
            userInfoEl.textContent += '您可以通过这个 ID 在服务器端查询用户信息。';
          } else {
            userInfoEl.textContent = '无法获取用户信息：缺少 user_id 或 start_param 参数。\n\n';
            userInfoEl.textContent += '在 Telegram 游戏中，通常需要通过 start_param 传递用户信息。';
          }
        }
      } catch (e) {
        userInfoEl.textContent = '获取用户信息失败: ' + e.toString();
      }
    };
  </script>
</body>
</html>
