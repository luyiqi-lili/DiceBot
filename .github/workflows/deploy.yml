name: 🚀 Deploy Workers

on:
  push:
    branches:
      - '**'       # 监听所有分支
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: 部署到 Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 安装项目依赖
        run: npm ci
          
      - name: 安装 Wrangler CLI
        run: npm install -g wrangler

      - name: Wrangler 登录（可选，以验证环境变量）
        run: wrangler whoami
  
      - name: 部署到 Workers
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            wrangler deploy -e prod
            echo "ENV=prod" >> $GITHUB_ENV
          else
            wrangler deploy -e dev
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      - name: 发送部署通知到 Telegram
        if: success()
        run: |
          bash scripts/notify-deploy.sh \
            "${{ env.ENV }}" \
            "${{ github.sha }}" \
            "${{ github.event.head_commit.message }}"
