<!DOCTYPE html>
<html>
<head>
    <title>Hello Game</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/games.js"></script>
    <script>
        // Telegram Web App 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 检查是否在 Telegram 环境中
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                // 初始化
                Telegram.WebApp.ready();
                
                // 获取 URL 参数中的用户信息
                const urlParams = new URLSearchParams(window.location.search);
                const userId = urlParams.get('user_id');
                
                console.log('Telegram WebApp 初始化完成，用户ID:', userId);
            }
        });
        
        // 提交分数的函数
        function submitScore(score) {
            console.log('尝试提交分数:', score);
            
            // 方法1: 使用 TelegramGameProxy（旧版）
            if (typeof TelegramGameProxy !== 'undefined') {
                TelegramGameProxy.sendScore(score);
                console.log('使用 TelegramGameProxy 提交分数');
                return;
            }
            
            // 方法2: 使用 Telegram WebApp（新版）
            if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({
                    action: 'submit_score',
                    score: score
                }));
                console.log('使用 Telegram.WebApp 提交分数');
                return;
            }
            
            // 方法3: 直接调用 Bot API（作为后备）
            console.log('非Telegram环境，无法提交分数');
            alert(`你的分数是: ${score}\n（在Telegram中打开以提交分数）`);
        }
        
        // 示例：游戏结束时的处理
        function gameOver() {
            // 假设游戏得分为 100
            const score = 100;
            
            // 提交分数
            submitScore(score);
            
            // 显示结果
            document.getElementById('result').innerHTML = `
                <h3>游戏结束！</h3>
                <p>你的分数: ${score}</p>
                <p>分数已提交到排行榜</p>
            `;
        }
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
        }
        button {
            background: #fff;
            color: #764ba2;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            transition: transform 0.3s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 Hello Game</h1>
        <p>这是一个简单的Telegram游戏示例</p>
        
        <div style="margin: 30px 0;">
            <h3>模拟游戏过程：</h3>
            <p>点击下面的按钮模拟游戏完成</p>
            <button onclick="gameOver()">🎯 完成游戏并提交分数</button>
        </div>
        
        <div id="result">
            <p>游戏结果将显示在这里</p>
        </div>
        
        <div style="margin-top: 30px; font-size: 14px; opacity: 0.8;">
            <p>在 Telegram 中打开此页面以获得完整功能</p>
        </div>
    </div>
    
    <script>
        // 获取并显示URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        const username = urlParams.get('username');
        
        if (userId) {
            document.getElementById('result').innerHTML = `
                <p>👤 玩家: ${decodeURIComponent(username || '匿名')}</p>
                <p>🆔 ID: ${userId}</p>
            `;
        }
    </script>
</body>
</html>
